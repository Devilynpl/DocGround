[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docground"
version = "0.1.0"
description = "Production-grade RAG on complex enterprise documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "tabulate>=0.9.0",
    "rich>=13.7.1",
    "streamlit>=1.36.0"
]

[tool.setuptools.packages.find]
where = ["src"]
